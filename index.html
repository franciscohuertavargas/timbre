<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Timbre 191</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:system-ui,sans-serif;background:#f4f1ec;color:#222;padding:24px;box-sizing:border-box;text-align:center}
  .bell{font-size:72px}
  h1{margin:0;font-size:2rem;line-height:1.2}
  p{margin:0;color:#555;font-size:1rem}
</style>
</head>
<body>
  <div class="bell" id="icon">🔔</div>
  <h1 id="title">Avisando…</h1>
  <p id="sub"></p>
<script>
const TOPIC = 'timbre191-b1009aaa26cf8d2a';
const COOLDOWN_MS = 60000;
const $ = id => document.getElementById(id);

function ok() {
  $('icon').textContent = '👋';
  $('title').textContent = 'Hola, ya voy a la puerta!';
  $('sub').textContent = '';
}

async function ring() {
  let last = 0;
  try { last = +localStorage.getItem('lastRing') || 0; } catch (e) {}
  if (Date.now() - last < COOLDOWN_MS) return ok();   // ya avisaste hace poco
  try {
    const r = await fetch('https://ntfy.sh/', {
      method: 'POST',
      body: JSON.stringify({
        topic: TOPIC,
        title: 'Timbre 191',
        message: 'Alguien está en la puerta',
        priority: 4,
        tags: ['bell']
      })
    });
    if (!r.ok) throw new Error(r.status);
    try { localStorage.setItem('lastRing', Date.now()); } catch (e) {}
    ok();
  } catch (e) {
    $('icon').textContent = '⚠️';
    $('title').textContent = 'No se pudo avisar';
    $('sub').textContent = 'Revisa tu conexión y vuelve a escanear el QR.';
  }
}
ring();
</script>
</body>
</html>
